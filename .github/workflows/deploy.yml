name: Deploy (Production VPS)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production release'
        required: true
        default: 'deploy'
      orphaned_migration_policy:
        description: 'Kebijakan Migration Guard (pakai strict untuk normal, allow_once/prune_history HANYA darurat)'
        required: false
        default: 'strict'
        type: choice
        options:
          - 'strict'
          - 'allow_once'
          - 'prune_history'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-vps
  cancel-in-progress: false

jobs:
  validate-guard:
    name: Validate Manual Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Deployment canceled. Confirmation must be exactly 'deploy'."
            exit 1
          fi

      - name: Verify Branch is Main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production deployment is strictly allowed ONLY from branch 'main'. Current ref: ${{ github.ref }}"
            exit 1
          fi

  ci:
    name: Validate CI Before Production Release
    needs: validate-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Checks
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('be-net/**/*.csproj', 'be-net/Inventory.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend
        run: dotnet restore be-net/Inventory.sln

      - name: Build Backend (Release)
        run: dotnet build be-net/Inventory.sln -c Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test be-net/tests/Inventory.Application.UnitTests/Inventory.Application.UnitTests.csproj -c Release --no-build --verbosity normal

      - name: Verify EF Core Migrations Integrity
        run: |
          set -euo pipefail
          dotnet tool install --global dotnet-ef --version 8.0.8 || dotnet tool update --global dotnet-ef --version 8.0.8
          export PATH="$PATH:$HOME/.dotnet/tools"
          echo "[ef-check] Checking for pending unmigrated model changes..."
          dotnet ef migrations has-pending-model-changes \
            --project be-net/src/Inventory.Infrastructure \
            --startup-project be-net/src/Inventory.Api \
            --configuration Release \
            --no-build
          echo "[ef-check] Generating dry-run idempotent SQL script to validate migrations..."
          dotnet ef migrations script --idempotent \
            --project be-net/src/Inventory.Infrastructure \
            --startup-project be-net/src/Inventory.Api \
            --configuration Release \
            --no-build \
            -o /tmp/ef-verify.sql
          test -s /tmp/ef-verify.sql
          echo "[ef-check] EF Core migrations and ModelSnapshot are synchronized."

      # Frontend Checks
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe-react/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: fe-react
        run: npm ci

      - name: Run Frontend Lint
        working-directory: fe-react
        run: npm run lint

      - name: Run TypeScript Type-Check
        working-directory: fe-react
        run: npx tsc --noEmit

      - name: Build Frontend Application
        working-directory: fe-react
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
        run: npm run build

  build_images:
    name: Build & Push Images to GHCR (Production)
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: image_tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./be-net
          file: be-net/Dockerfile
          target: runtime
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-backend:latest
            ghcr.io/${{ github.repository_owner }}/inventory-backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./fe-react
          file: fe-react/Dockerfile
          target: runner
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:latest
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Production VPS
    needs: build_images
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build_images.outputs.image_tag }}
      APP_DOMAIN: ${{ secrets.APP_DOMAIN || secrets.CERTBOT_DOMAINS }}
      CERTBOT_DOMAINS: ${{ secrets.APP_DOMAIN || secrets.CERTBOT_DOMAINS }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT || '8080' }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '1521' }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
      ORPHANED_MIGRATION_POLICY: ${{ github.event.inputs.orphaned_migration_policy || 'strict' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Validate Required Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ] || [ -z "${VPS_PATH:-}" ]; then
            echo "::error::Missing VPS secrets in GitHub Environment 'production'. Required: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH."
            exit 1
          fi

      - name: Prepare Environment Files
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/envs
          if [ -n "${BACKEND_ENV:-}" ]; then
            printf "%s\n" "${BACKEND_ENV}" > /tmp/envs/backend.env
          else
            touch /tmp/envs/backend.env
          fi

          if [ -n "${FRONTEND_ENV:-}" ]; then
            printf "%s\n" "${FRONTEND_ENV}" > /tmp/envs/frontend.env
          else
            touch /tmp/envs/frontend.env
          fi

      - name: Setup SSH Key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Pre-Deploy Database Backup (Production Safety Snapshot)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          echo "[pre-deploy] Memeriksa apakah container Oracle Production (inventory-oracle) sudah berjalan..."
          ORACLE_RUNNING=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "docker inspect -f '{{.State.Running}}' inventory-oracle 2>/dev/null || echo 'false'")

          if [ "${ORACLE_RUNNING}" != "true" ]; then
            echo "[pre-deploy] Container 'inventory-oracle' belum berjalan (first-time production setup). Pre-deploy backup dilewati."
            echo "PRE_DEPLOY_BACKUP=none" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "[pre-deploy] Mengambil snapshot backup Oracle Production sebelum deployment..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "if [ ! -d '${VPS_PATH}' ]; then sudo mkdir -p '${VPS_PATH}'; fi && \
             if [ ! -w '${VPS_PATH}' ]; then sudo chown -R '${VPS_USER}:${VPS_USER}' '${VPS_PATH}'; fi && \
             mkdir -p '${VPS_PATH}/backups'"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/backup/backup-oracle.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/backup-oracle.sh"

          BACKUP_OUTPUT=$(ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${VPS_PATH}/backup-oracle.sh && \
             CONTAINER_NAME=inventory-oracle \
             VPS_PATH=${VPS_PATH} \
             bash ${VPS_PATH}/backup-oracle.sh production")

          echo "${BACKUP_OUTPUT}"
          BACKUP_NAME=$(echo "${BACKUP_OUTPUT}" | grep -m 1 "OUTPUT_BACKUP_NAME=" | cut -d'=' -f2 || true)
          echo "PRE_DEPLOY_BACKUP=${BACKUP_NAME:-created}" >> "$GITHUB_ENV"
          echo "[pre-deploy] Snapshot backup berhasil dibuat: ${BACKUP_NAME:-created}"

      - name: Deploy to Production VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "[deploy] Connecting to Production VPS at ${VPS_HOST}..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "if [ ! -d '${VPS_PATH}' ]; then sudo mkdir -p '${VPS_PATH}'; fi && \
             if [ ! -w '${VPS_PATH}' ]; then sudo chown -R '${VPS_USER}:${VPS_USER}' '${VPS_PATH}'; fi && \
             mkdir -p '${VPS_PATH}/backend' '${VPS_PATH}/frontend' '${VPS_PATH}/deploy/logs' '${VPS_PATH}/deploy/state' '${VPS_PATH}/backups'"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/envs/backend.env "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/backend/.env.production"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/envs/frontend.env "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/frontend/.env.production"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 infrastructure/docker/docker-compose.prod.yml "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/deploy/deploy-remote.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/deploy-remote.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/deploy/setup-ssl.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/setup-ssl.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/deploy/verify-deployment.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/verify-deployment.sh"

          echo "[deploy] Logging in to GHCR on VPS via stdin (supports private packages)..."
          printf "%s\n" "${GITHUB_TOKEN}" | ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${VPS_PATH}/deploy-remote.sh && \
             IMAGE_TAG=${IMAGE_TAG} \
             REGISTRY_OWNER=${REGISTRY_OWNER} \
             VPS_PATH=${VPS_PATH} \
             COMPOSE_FILE=${VPS_PATH}/docker-compose.prod.yml \
             BACKEND_ENV_FILE=${VPS_PATH}/backend/.env.production \
             FRONTEND_ENV_FILE=${VPS_PATH}/frontend/.env.production \
             FRONTEND_PORT=${FRONTEND_PORT} \
             BACKEND_PORT=${BACKEND_PORT} \
             ORACLE_PORT=${ORACLE_PORT} \
             ORPHANED_MIGRATION_POLICY=${ORPHANED_MIGRATION_POLICY} \
             bash ${VPS_PATH}/deploy-remote.sh deploy"

      - name: Update Nginx Config (Production)
        if: ${{ env.APP_DOMAIN != '' || env.CERTBOT_DOMAINS != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          TARGET_DOMAIN="${APP_DOMAIN:-${CERTBOT_DOMAINS}}"
          echo "[nginx] Configuring Nginx for Production Domain: ${TARGET_DOMAIN}..."
          cp infrastructure/nginx/inventory.conf /tmp/inventory.conf
          sed -i "s/DOMAIN_PLACEHOLDER/${TARGET_DOMAIN}/g" /tmp/inventory.conf
          sed -i "s/FRONTEND_PORT_PLACEHOLDER/${FRONTEND_PORT}/g" /tmp/inventory.conf
          sed -i "s/BACKEND_PORT_PLACEHOLDER/${BACKEND_PORT}/g" /tmp/inventory.conf
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/inventory.conf "${VPS_USER}@${VPS_HOST}:/tmp/inventory.conf"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y nginx
            fi &&
            sudo ufw allow 80/tcp 2>/dev/null || true &&
            sudo ufw allow 443/tcp 2>/dev/null || true &&
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled &&
            sudo mv /tmp/inventory.conf /etc/nginx/sites-available/inventory.conf &&
            sudo ln -sf /etc/nginx/sites-available/inventory.conf /etc/nginx/sites-enabled/inventory.conf &&
            sudo rm -f /etc/nginx/sites-enabled/default &&
            sudo nginx -t &&
            sudo systemctl enable nginx &&
            sudo systemctl reload nginx"

      - name: Setup HTTPS (Certbot Production)
        if: ${{ (env.APP_DOMAIN != '' || env.CERTBOT_DOMAINS != '') && env.CERTBOT_EMAIL != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          TARGET_DOMAIN="${APP_DOMAIN:-${CERTBOT_DOMAINS}}"
          echo "[certbot] Checking SSL Certificate for: ${TARGET_DOMAIN}..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${VPS_PATH}/setup-ssl.sh && bash ${VPS_PATH}/setup-ssl.sh '${TARGET_DOMAIN}' '${CERTBOT_EMAIL}'"

      - name: Verify Deployment Health (Smoke Test)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          TARGET_DOMAIN="${APP_DOMAIN:-${CERTBOT_DOMAINS:-}}"
          echo "[verify] Running healthcheck on deployed services..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${VPS_PATH}/verify-deployment.sh && bash ${VPS_PATH}/verify-deployment.sh '${FRONTEND_PORT}' '${BACKEND_PORT}' '${TARGET_DOMAIN}'"

      - name: Send Deployment Notification to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[telegram] TELEGRAM_BOT_TOKEN atau TELEGRAM_CHAT_ID belum diset. Notifikasi dilewati."
            exit 0
          fi
          TARGET_DOMAIN="${APP_DOMAIN:-${CERTBOT_DOMAINS:-Server IP}}"
          PRE_BACKUP_INFO="${PRE_DEPLOY_BACKUP:-none}"
          DEPLOY_TIME=$(TZ="Asia/Jakarta" date +"%Y-%m-%d %H:%M:%S WIB")
          if [ "${STATUS}" = "success" ]; then
            ICON="🚀"
            TEXT="<b>${ICON} [DEPLOYMENT SUKSES] InventoryNet Core</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🌍 <b>Environment:</b> <code>Production</code>%0A📅 <b>Waktu:</b> <code>${DEPLOY_TIME}</code>%0A🔖 <b>Image Tag:</b> <code>${IMAGE_TAG}</code>%0A👤 <b>Trigger By:</b> ${{ github.actor }}%0A🌐 <b>Domain:</b> https://${TARGET_DOMAIN}%0A🛡️ <b>SSL/Proxy:</b> Cloudflare Tunnel%0A💾 <b>Pre-Deploy Backup:</b> <code>${PRE_BACKUP_INFO}</code>%0A🔌 <b>Ports:</b> Frontend=${FRONTEND_PORT}, Backend=${BACKEND_PORT}, Oracle=${ORACLE_PORT}%0A🔗 <b>Run Log:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Lihat Detail Log</a>%0A✅ <b>Status:</b> Layanan Aktif dan Siap Digunakan!%0A━━━━━━━━━━━━━━━━━━━━"
          else
            ICON="❌"
            TEXT="<b>${ICON} [DEPLOYMENT GAGAL / ABORT] InventoryNet Core</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🌍 <b>Environment:</b> <code>Production</code>%0A📅 <b>Waktu:</b> <code>${DEPLOY_TIME}</code>%0A👤 <b>Trigger By:</b> ${{ github.actor }}%0A💾 <b>Pre-Deploy Backup:</b> <code>${PRE_BACKUP_INFO}</code>%0A🔌 <b>Target Ports:</b> Frontend=${FRONTEND_PORT}, Backend=${BACKEND_PORT}, Oracle=${ORACLE_PORT}%0A⚠️ <b>Perhatian:</b> Deployment dibatalkan atau gagal! Kemungkinan terjadi bentrok port (Collision), Migration Guard error, atau error runtime server.%0A🔗 <b>Run Log:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Cek Penyebab di Sini</a>%0A━━━━━━━━━━━━━━━━━━━━"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$(printf '%b' "${TEXT}")" \
            -d "parse_mode=HTML" > /dev/null || true
