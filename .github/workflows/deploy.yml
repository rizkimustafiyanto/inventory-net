name: Deploy (Production VPS)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production release'
        required: true
        default: 'deploy'

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production-vps
  cancel-in-progress: false

jobs:
  validate-guard:
    name: Validate Manual Trigger Guard
    runs-on: ubuntu-latest
    steps:
      - name: Verify Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "::error::Deployment canceled. Confirmation must be exactly 'deploy'."
            exit 1
          fi

      - name: Verify Branch is Main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production deployment is strictly allowed ONLY from branch 'main'. Current ref: ${{ github.ref }}"
            exit 1
          fi

  ci:
    name: Validate CI Before Production Release
    needs: validate-guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Backend Checks
      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('be-net/**/*.csproj', 'be-net/Inventory.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Backend
        run: dotnet restore be-net/Inventory.sln

      - name: Build Backend (Release)
        run: dotnet build be-net/Inventory.sln -c Release --no-restore

      - name: Run Backend Unit Tests
        run: dotnet test be-net/tests/Inventory.Application.UnitTests/Inventory.Application.UnitTests.csproj -c Release --no-build --verbosity normal

      # Frontend Checks
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fe-react/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: fe-react
        run: npm ci

      - name: Run Frontend Lint
        working-directory: fe-react
        run: npm run lint

      - name: Run TypeScript Type-Check
        working-directory: fe-react
        run: npx tsc --noEmit

      - name: Build Frontend Application
        working-directory: fe-react
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
        run: npm run build

  build_images:
    name: Build & Push Images to GHCR (Production)
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image_tag.outputs.image_tag }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: image_tag
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./be-net
          file: be-net/Dockerfile
          target: runtime
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-backend:latest
            ghcr.io/${{ github.repository_owner }}/inventory-backend:${{ env.IMAGE_TAG }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./fe-react
          file: fe-react/Dockerfile
          target: runner
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8080' }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:latest
            ghcr.io/${{ github.repository_owner }}/inventory-frontend:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy to Production VPS
    needs: build_images
    runs-on: ubuntu-latest
    environment: production
    env:
      IMAGE_TAG: ${{ needs.build_images.outputs.image_tag }}
      CERTBOT_DOMAINS: ${{ secrets.CERTBOT_DOMAINS }}
      CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
      FRONTEND_PORT: ${{ secrets.FRONTEND_PORT || '3000' }}
      BACKEND_PORT: ${{ secrets.BACKEND_PORT || '8080' }}
      ORACLE_PORT: ${{ secrets.ORACLE_PORT || '1521' }}
      TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        if: ${{ env.TAILSCALE_AUTHKEY != '' }}
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ env.TAILSCALE_AUTHKEY }}

      - name: Validate Required Secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
        run: |
          set -euo pipefail
          if [ -z "${VPS_HOST:-}" ] || [ -z "${VPS_USER:-}" ] || [ -z "${VPS_SSH_KEY:-}" ] || [ -z "${VPS_PATH:-}" ]; then
            echo "::error::Missing VPS secrets in GitHub Environment 'production'. Required: VPS_HOST, VPS_USER, VPS_SSH_KEY, VPS_PATH."
            exit 1
          fi

      - name: Prepare Environment Files
        env:
          BACKEND_ENV: ${{ secrets.BACKEND_ENV }}
          FRONTEND_ENV: ${{ secrets.FRONTEND_ENV }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/envs
          if [ -n "${BACKEND_ENV:-}" ]; then
            printf "%s\n" "${BACKEND_ENV}" > /tmp/envs/backend.env
          else
            touch /tmp/envs/backend.env
          fi

          if [ -n "${FRONTEND_ENV:-}" ]; then
            printf "%s\n" "${FRONTEND_ENV}" > /tmp/envs/frontend.env
          else
            touch /tmp/envs/frontend.env
          fi

      - name: Setup SSH Key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy to Production VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "[deploy] Connecting to Production VPS at ${VPS_HOST}..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p ${VPS_PATH}/backend ${VPS_PATH}/frontend ${VPS_PATH}/deploy/logs ${VPS_PATH}/deploy/state"

          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/envs/backend.env "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/backend/.env.production"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/envs/frontend.env "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/frontend/.env.production"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 infrastructure/docker/docker-compose.prod.yml "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/docker-compose.prod.yml"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 scripts/deploy/deploy-remote.sh "${VPS_USER}@${VPS_HOST}:${VPS_PATH}/deploy-remote.sh"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "chmod +x ${VPS_PATH}/deploy-remote.sh && \
             IMAGE_TAG=${IMAGE_TAG} \
             REGISTRY_OWNER=${REGISTRY_OWNER} \
             VPS_PATH=${VPS_PATH} \
             COMPOSE_FILE=${VPS_PATH}/docker-compose.prod.yml \
             BACKEND_ENV_FILE=${VPS_PATH}/backend/.env.production \
             FRONTEND_ENV_FILE=${VPS_PATH}/frontend/.env.production \
             FRONTEND_PORT=${FRONTEND_PORT} \
             BACKEND_PORT=${BACKEND_PORT} \
             ORACLE_PORT=${ORACLE_PORT} \
             bash ${VPS_PATH}/deploy-remote.sh deploy"

      - name: Update Nginx Config (Production)
        if: ${{ env.CERTBOT_DOMAINS != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "[nginx] Configuring Nginx for Production Domain: ${CERTBOT_DOMAINS}..."
          cp infrastructure/nginx/inventory.conf /tmp/inventory.conf
          sed -i "s/DOMAIN_PLACEHOLDER/${CERTBOT_DOMAINS}/g" /tmp/inventory.conf
          sed -i "s/FRONTEND_PORT_PLACEHOLDER/${FRONTEND_PORT}/g" /tmp/inventory.conf
          sed -i "s/BACKEND_PORT_PLACEHOLDER/${BACKEND_PORT}/g" /tmp/inventory.conf
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 /tmp/inventory.conf "${VPS_USER}@${VPS_HOST}:/tmp/inventory.conf"

          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" \
            "if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update -y && sudo apt-get install -y nginx
            fi &&
            sudo mkdir -p /etc/nginx/sites-available /etc/nginx/sites-enabled &&
            sudo mv /tmp/inventory.conf /etc/nginx/sites-available/inventory.conf &&
            sudo ln -sf /etc/nginx/sites-available/inventory.conf /etc/nginx/sites-enabled/inventory.conf &&
            sudo rm -f /etc/nginx/sites-enabled/default &&
            sudo nginx -t &&
            sudo systemctl enable nginx &&
            sudo systemctl reload nginx"

      - name: Setup HTTPS (Certbot Production)
        if: ${{ env.CERTBOT_DOMAINS != '' && env.CERTBOT_EMAIL != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          echo "[certbot] Requesting SSL Certificate for: ${CERTBOT_DOMAINS}..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 "${VPS_USER}@${VPS_HOST}" "
            set -euo pipefail
            echo '[certbot] Menunggu apt lock tersedia (maks 3 menit)...'
            for i in \$(seq 1 18); do
              if ! sudo fuser /var/lib/apt/lists/lock /var/lib/dpkg/lock-frontend > /dev/null 2>&1; then
                echo '[certbot] apt lock tersedia.'
                break
              fi
              echo '[certbot] apt masih terkunci, menunggu 10 detik...'
              sleep 10
            done

            # Perbaiki mirror regional yang sering 403 / corrupt ke mirror resmi Ubuntu
            sudo sed -i 's|http://id.archive.ubuntu.com/|http://archive.ubuntu.com/|g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true

            if ! command -v certbot > /dev/null 2>&1; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
              sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --fix-missing --no-install-recommends certbot python3-certbot-nginx
            fi

            if ! sudo certbot --nginx --non-interactive --agree-tos --keep-until-expiring \
              --expand -m ${CERTBOT_EMAIL} \$(printf -- '-d %s ' ${CERTBOT_DOMAINS}); then
              echo '::warning::[certbot] Let\'s Encrypt SSL issuance gagal (wajar jika server di balik NAT / Tailscale tanpa port 80 publik). Layanan Nginx tetap aktif via HTTP.'
            fi
            sudo systemctl reload nginx || true
          "

      - name: Send Deployment Notification to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "[telegram] TELEGRAM_BOT_TOKEN atau TELEGRAM_CHAT_ID belum diset. Notifikasi dilewati."
            exit 0
          fi
          DEPLOY_TIME=$(TZ="Asia/Jakarta" date +"%Y-%m-%d %H:%M:%S WIB")
          if [ "${STATUS}" = "success" ]; then
            ICON="🚀"
            TEXT="<b>${ICON} [DEPLOYMENT SUKSES] InventoryNet Core</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🌍 <b>Environment:</b> <code>Production</code>%0A📅 <b>Waktu:</b> <code>${DEPLOY_TIME}</code>%0A🔖 <b>Image Tag:</b> <code>${IMAGE_TAG}</code>%0A👤 <b>Trigger By:</b> ${{ github.actor }}%0A🌐 <b>Domain:</b> ${CERTBOT_DOMAINS:-Server IP}%0A🔌 <b>Ports:</b> Frontend=${FRONTEND_PORT}, Backend=${BACKEND_PORT}, Oracle=${ORACLE_PORT}%0A🔗 <b>Run Log:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Lihat Detail Log</a>%0A✅ <b>Status:</b> Layanan Aktif dan Siap Digunakan!%0A━━━━━━━━━━━━━━━━━━━━"
          else
            ICON="❌"
            TEXT="<b>${ICON} [DEPLOYMENT GAGAL / ABORT] InventoryNet Core</b>%0A━━━━━━━━━━━━━━━━━━━━%0A🌍 <b>Environment:</b> <code>Production</code>%0A📅 <b>Waktu:</b> <code>${DEPLOY_TIME}</code>%0A👤 <b>Trigger By:</b> ${{ github.actor }}%0A🔌 <b>Target Ports:</b> Frontend=${FRONTEND_PORT}, Backend=${BACKEND_PORT}, Oracle=${ORACLE_PORT}%0A⚠️ <b>Perhatian:</b> Deployment dibatalkan atau gagal! Kemungkinan terjadi bentrok port (Collision) atau error runtime server.%0A🔗 <b>Run Log:</b> <a href=\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\">Cek Penyebab di Sini</a>%0A━━━━━━━━━━━━━━━━━━━━"
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=$(printf '%b' "${TEXT}")" \
            -d "parse_mode=HTML" > /dev/null || true
