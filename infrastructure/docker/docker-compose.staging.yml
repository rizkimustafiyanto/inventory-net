services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: inventory-staging-oracle
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-YourPassword123}
      APP_USER: ${APP_USER:-inventory_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-YourPassword123}
    # Database port tidak diekspose ke host untuk mencegah konflik port di VPS dan menjaga keamanan.
    # Backend berkomunikasi secara internal via network 'inventory-staging-network'.
    # ports:
    #   - "127.0.0.1:${ORACLE_PORT:-1522}:1521"
    volumes:
      - oracle_staging_data:/opt/oracle/oradata
    networks:
      - inventory-staging-network
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 25
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: inventory-staging-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-YourRedisPassword123}"
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    # Redis port tidak diekspose ke host untuk mencegah "Bind for 0.0.0.0:6379 failed: port is already allocated"
    # saat VPS digunakan bersama dengan project lain yang memakai Redis.
    # Backend berkomunikasi secara internal via network 'inventory-staging-network'.
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_staging_data:/data
    networks:
      - inventory-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YourRedisPassword123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/${REGISTRY_OWNER}/inventory-backend:${IMAGE_TAG:-staging}
    container_name: inventory-staging-backend
    restart: unless-stopped
    depends_on:
      oracle:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379,password=${REDIS_PASSWORD:-YourRedisPassword123}}
      - DatabaseMigration__OrphanedMigrationPolicy=${ORPHANED_MIGRATION_POLICY:-strict}
    ports:
      # Bind ke 127.0.0.1 agar hanya bisa diakses via Nginx reverse proxy dan port bisa disesuaikan jika bentrok
      - "127.0.0.1:${BACKEND_PORT:-8081}:8080"
    volumes:
      - uploads_staging_data:/app/uploads
    networks:
      - inventory-staging-network

  frontend:
    image: ghcr.io/${REGISTRY_OWNER}/inventory-frontend:${IMAGE_TAG:-staging}
    container_name: inventory-staging-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env.production}
    ports:
      # Bind ke 127.0.0.1 agar hanya bisa diakses via Nginx reverse proxy dan port bisa disesuaikan jika bentrok
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    networks:
      - inventory-staging-network

volumes:
  oracle_staging_data:
    name: inventory_staging_oracle_data
  redis_staging_data:
    name: inventory_staging_redis_data
  uploads_staging_data:
    name: inventory_staging_uploads_data

networks:
  inventory-staging-network:
    name: inventory_staging_network
    driver: bridge
