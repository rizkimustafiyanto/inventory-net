services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: inventory-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-YourPassword123}
      APP_USER: ${APP_USER:-inventory_user}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-YourPassword123}
    # Database port tidak diekspose ke host untuk mencegah konflik port di VPS dan menjaga keamanan.
    # Backend berkomunikasi secara internal via network 'inventory-network'.
    # ports:
    #   - "127.0.0.1:${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - inventory-network

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-YourRedisPassword123}"
    # Redis port tidak diekspose ke host untuk mencegah "Bind for 0.0.0.0:6379 failed: port is already allocated"
    # saat VPS digunakan bersama dengan project lain yang memakai Redis.
    # Backend berkomunikasi secara internal via network 'inventory-network'.
    # ports:
    #   - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-YourRedisPassword123}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/${REGISTRY_OWNER}/inventory-backend:${IMAGE_TAG:-latest}
    container_name: inventory-backend
    restart: unless-stopped
    depends_on:
      - oracle
      - redis
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    environment:
      - ConnectionStrings__Redis=${ConnectionStrings__Redis:-redis:6379,password=${REDIS_PASSWORD:-YourRedisPassword123}}
    ports:
      # Bind ke 127.0.0.1 agar hanya bisa diakses via Nginx reverse proxy dan port bisa disesuaikan jika bentrok
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - inventory-network

  frontend:
    image: ghcr.io/${REGISTRY_OWNER}/inventory-frontend:${IMAGE_TAG:-latest}
    container_name: inventory-frontend
    restart: unless-stopped
    depends_on:
      - backend
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env.production}
    ports:
      # Bind ke 127.0.0.1 agar hanya bisa diakses via Nginx reverse proxy dan port bisa disesuaikan jika bentrok
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    networks:
      - inventory-network

volumes:
  oracle_data:
    name: inventory_oracle_data
  redis_data:
    name: inventory_redis_data
  uploads_data:
    name: inventory_uploads_data

networks:
  inventory-network:
    name: inventory_network
    driver: bridge
