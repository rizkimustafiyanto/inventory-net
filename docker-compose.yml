services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: inventory-oracle
    restart: unless-stopped
    environment:
      ORACLE_PASSWORD: "YourPassword123"
      APP_USER: "inventory_user"
      APP_USER_PASSWORD: "YourPassword123"
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle_data:/opt/oracle/oradata
    networks:
      - inventory-network

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Port mapping ke host dinonaktifkan agar tidak bentrok dengan Redis dari project lain di VPS/mesin lokal.
    # Backend berkomunikasi langsung dengan Redis melalui internal Docker network (redis:6379).
    # Aktifkan jika benar-benar butuh akses Redis langsung dari host (misal via Redis Insight).
    # ports:
    #   - "${REDIS_PORT:-6385}:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventory-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    container_name: inventory-backend
    build:
      context: ./be-net
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      - oracle
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "true"
      ConnectionStrings__OracleConnection: "Data Source=oracle:1521/FREEPDB1;User Id=inventory_user;Password=YourPassword123;"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: "INVENTORY_NET_ULTRA_SECURE_JWT_SECRET_KEY_2026_TEST_KEY_MUST_BE_LONG!"
      Jwt__Issuer: "InventoryNetApi"
      Jwt__Audience: "InventoryNetClient"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - inventory-network
    develop:
      watch:
        - action: rebuild
          path: ./be-net/Inventory.sln
        - action: rebuild
          path: ./be-net/src/Inventory.Domain/Inventory.Domain.csproj
        - action: rebuild
          path: ./be-net/src/Inventory.Application/Inventory.Application.csproj
        - action: rebuild
          path: ./be-net/src/Inventory.Infrastructure/Inventory.Infrastructure.csproj
        - action: rebuild
          path: ./be-net/src/Inventory.Api/Inventory.Api.csproj
        - action: sync
          path: ./be-net/src
          target: /app/src
          ignore:
            - "bin/"
            - "obj/"
            - "**/bin/**"
            - "**/obj/**"

  frontend:
    container_name: inventory-frontend
    build:
      context: ./fe-react
      dockerfile: Dockerfile
      target: dev
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: "development"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      WATCHPACK_POLLING: "true"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./fe-react/src:/app/src
      - ./fe-react/public:/app/public
    networks:
      - inventory-network
    develop:
      watch:
        - action: rebuild
          path: ./fe-react/package.json
        - action: rebuild
          path: ./fe-react/package-lock.json
        - action: sync+restart
          path: ./fe-react/next.config.ts
          target: /app/next.config.ts
        - action: sync+restart
          path: ./fe-react/postcss.config.mjs
          target: /app/postcss.config.mjs
        - action: sync+restart
          path: ./fe-react/tsconfig.json
          target: /app/tsconfig.json
        - action: sync
          path: ./fe-react/src
          target: /app/src
        - action: sync
          path: ./fe-react/public
          target: /app/public

volumes:
  oracle_data:
  redis_data:
  uploads_data:

networks:
  inventory-network:
    driver: bridge
